<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Loop Engineering</title><desc id="d">Make every agent loop observable, bounded and able to terminate.</desc><rect width="1200" height="680" rx="28" fill="#0b1020"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6ea8ff"/></marker><linearGradient id="g" x1="0" x2="1"><stop stop-color="#244cff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><text x="60" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Loop Engineering</text><text x="60" y="105" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Make every agent loop observable, bounded and able to terminate.</text><path d="M280 316H335" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M525 316H580" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M770 316H825" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M920 362L720 470" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M580 470L185 362" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><g><rect x="90" y="270" width="190" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="108" y="304" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Observe</text><text x="108" y="330" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">state + context</text></g><g><rect x="335" y="270" width="190" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="353" y="304" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Decide</text><text x="353" y="330" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">next action</text></g><g><rect x="580" y="270" width="190" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="598" y="304" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Act</text><text x="598" y="330" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">tool / model</text></g><g><rect x="825" y="270" width="190" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="843" y="304" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Verify</text><text x="843" y="330" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">did it work?</text></g><g><rect x="450" y="470" width="300" height="92" rx="18" fill="#151d35" stroke="#22c55e" stroke-width="2"/><text x="468" y="504" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Terminate / Continue</text><text x="468" y="530" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">explicit stop condition</text></g></svg>