<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Human-in-the-Loop Design</title><desc id="d">Put human review at the decision boundary where uncertainty or impact warrants it.</desc><rect width="1200" height="680" rx="28" fill="#0b1020"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6ea8ff"/></marker><linearGradient id="g" x1="0" x2="1"><stop stop-color="#244cff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><text x="60" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Human-in-the-Loop Design</text><text x="60" y="105" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Put human review at the decision boundary where uncertainty or impact warrants it.</text><path d="M270 306H320" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M540 296L590 206" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M540 326L590 406" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M810 206L860 286" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M810 406L860 306" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><g><rect x="70" y="260" width="200" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="88" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Agent</text><text x="88" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">propose action</text></g><g><rect x="320" y="260" width="220" height="92" rx="18" fill="#151d35" stroke="#f59e0b" stroke-width="2"/><text x="338" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Risk gate</text><text x="338" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">confidence + impact</text></g><g><rect x="590" y="160" width="220" height="92" rx="18" fill="#151d35" stroke="#22c55e" stroke-width="2"/><text x="608" y="194" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Auto path</text><text x="608" y="220" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">low risk</text></g><g><rect x="590" y="360" width="220" height="92" rx="18" fill="#151d35" stroke="#8b5cf6" stroke-width="2"/><text x="608" y="394" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Human review</text><text x="608" y="420" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">high impact</text></g><g><rect x="860" y="260" width="240" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="878" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Commit action</text><text x="878" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">auditable outcome</text></g></svg>