<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Orchestration Patterns</title><desc id="d">Coordinate steps explicitly so retries and partial failure remain understandable.</desc><rect width="1200" height="680" rx="28" fill="#0b1020"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6ea8ff"/></marker><linearGradient id="g" x1="0" x2="1"><stop stop-color="#244cff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><text x="60" y="72" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800">Orchestration Patterns</text><text x="60" y="105" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">Coordinate steps explicitly so retries and partial failure remain understandable.</text><path d="M260 306L300 226" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M260 306L300 406" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M510 226L550 286" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M510 406L550 326" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><path d="M770 296H810" fill="none" stroke="#6ea8ff" stroke-width="3" marker-end="url(#a)" opacity=".9"/><g><rect x="70" y="260" width="190" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="88" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Trigger</text><text x="88" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">event / request</text></g><g><rect x="300" y="180" width="210" height="92" rx="18" fill="#151d35" stroke="#244cff" stroke-width="2"/><text x="318" y="214" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Plan</text><text x="318" y="240" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">state + dependencies</text></g><g><rect x="300" y="360" width="210" height="92" rx="18" fill="#151d35" stroke="#8b5cf6" stroke-width="2"/><text x="318" y="394" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Execute</text><text x="318" y="420" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">parallel / serial</text></g><g><rect x="550" y="260" width="220" height="92" rx="18" fill="#151d35" stroke="#22c55e" stroke-width="2"/><text x="568" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Checkpoint</text><text x="568" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">persist progress</text></g><g><rect x="810" y="260" width="250" height="92" rx="18" fill="#151d35" stroke="#31507d" stroke-width="2"/><text x="828" y="294" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Recover / Continue</text><text x="828" y="320" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="12">retry · compensate</text></g></svg>